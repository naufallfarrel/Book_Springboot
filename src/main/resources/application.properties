spring.application.name=contoh-daftar-buku
server.port=8080

# Database H2 in-memory (hilang saat aplikasi dimatikan)
spring.datasource.url=jdbc:h2:mem:perpustakaan
spring.datasource.username=sa
spring.datasource.password=
spring.h2.console.enabled=true

# Tabel dibuat dari schema.sql, lalu data.sql dijalankan.
# validate: aplikasi GAGAL START bila @Entity tidak cocok dengan schema.sql.
spring.sql.init.mode=always
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
